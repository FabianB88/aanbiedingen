en, maar we houden je altijd op de hoogte.\"],\"DE\":[\"De supersnelle leveringsservice is momenteel beschikbaar in Groot-Londen, Luton en Milton Keynes. In andere regio's is levering de volgende dag of binnen twee dagen mogelijk.\",\"Levertijden kunnen variëren, afhankelijk van het product en de bestemming. Standaardproducten worden snel geleverd, terwijl producten die speciale zorg nodig hebben de levertijden volgen die je tijdens het afrekenen ziet.\",\"Drukke feestdagen of onverwacht weer kunnen de levering soms wat vertragen, maar we houden je altijd op de hoogte.\"],\"NL\":[\"Onze same-day delivery is beschikbaar in geselecteerde gebieden in Nederland, waaronder Amsterdam, Rotterdam, Den Haag, Utrecht, Almere, Amersfoort, Tillburg, Breda en Eindhoven. \",\"Wil je weten of same-day delivery beschikbaar is op jouw adres? Vul eenvoudig je postcode in tijdens het afrekenen. Je ziet dan direct de meest actuele bezorgopties en levertijden.\",\" Is same-day delivery niet beschikbaar in jouw regio? Dan bieden we levering op de volgende werkdag of binnen twee werkdagen aan.\",\"Levertijden kunnen variëren afhankelijk van het product en de bestemming. Standaardproducten worden snel geleverd, terwijl producten die speciale zorg vereisen de levertijd volgen die tijdens het afrekenen wordt weergegeven.\",\"Tijdens drukke feestdagen of bij onverwachte weersomstandigheden kan de levering soms vertraging oplopen, maar we houden je altijd op de hoogte.\"]},\"textList\":{\"0\":\"De supersnelle leveringsservice is momenteel beschikbaar in Groot-Londen, Luton en Milton Keynes. In andere regio's is levering de volgende dag of binnen twee dagen mogelijk.\",\"1\":\"Levertijden kunnen variëren, afhankelijk van het product en de bestemming. Standaardproducten worden snel geleverd, terwijl producten die speciale zorg nodig hebben de levertijden volgen die je tijdens het afrekenen ziet.\",\"2\":\"Drukke feestdagen of onverwacht weer kunnen de levering soms wat vertragen, maar we houden je altijd op de hoogte.\"},\"textListForFr\":{\"0\":\"Momenteel biedt Joybuy ultrasnelle levering op dezelfde dag en de volgende dag in Groot-Parijs. In de rest van Frankrijk is levering beschikbaar de volgende dag of binnen 48 uur. \",\"1\":\"De levertijd kan variëren afhankelijk van het type product en de bestemming. De meeste producten worden snel geleverd maar artikelen die een speciale behandeling vereisen volgen de geschatte levertijd die bij het afrekenen wordt aangegeven. \",\"2\":\"Tijdens piekperiodes of bij uitzonderlijke weersomstandigheden kunnen levertijden worden verlengd. Joybuy houdt je steeds in realtime op de hoogte van de voortgang van je levering.\"},\"textListForOther\":{\"0\":\"De supersnelle leveringsservice is momenteel beschikbaar in Groot-Londen, Luton en Milton Keynes. In andere regio's is levering de volgende dag of binnen twee dagen mogelijk.\",\"1\":\"Levertijden kunnen variëren, afhankelijk van het product en de bestemming. Standaardproducten worden snel geleverd, terwijl producten die speciale zorg nodig hebben de levertijden volgen die je tijdens het afrekenen ziet.\",\"2\":\"Drukke feestdagen of onverwacht weer kunnen de levering soms wat vertragen, maar we houden je altijd op de hoogte.\"}}}}}},\"1\":{\"contextList\":{\"0\":{\"title\":\"Hoe werkt het?\",\"subTitle\":\"Kies je bezorgtijd\",\"textContentList\":{\"0\":{\"iconText\":\"Stap 1\",\"title\":\"Ga naar de afrekenpagina\",\"text\":\"Bekijk de beschikbare bezorgtijdslots direct op de afrekenpagina.\"},\"1\":{\"iconText\":\"Stap 2\",\"title\":\"Kies een tijdslot\",\"text\":\"Kies het tijdslot dat jou het beste uitkomt.\"},\"2\":{\"iconText\":\"Stap 3\",\"title\":\"Geniet van je JoyExpress levering\",\"text\":\"Onze vertrouwde bezorgpartner levert je bestelling tot aan je deur.\"}}}}}}},\"1\":{\"title\":\"Je favoriete merken, kwaliteit waar je op kunt vertrouwen\",\"titleFr\":\"Je favoriete merken, kwaliteit waar je op kunt vertrouwen\",\"contentList\":{\"0\":{\"contextList\":{ iconText\":\"Samsung\"},\"1\":{\"iconText\":\"PlayStation\"},\"2\":{\"iconText\":\"Morrisons\"},\"3\":{\"iconText\":\"De’Longhi\"}}},\"1\":{\"textContentList\":{\"0\":{\"title\":\"Groot nieuws\",\"subTitle\":\"Groot nieuws\",\"subTitleFr\":\"Groot nieuws\",\"subTitleNl\":\"Trotse UEFA sponsor\",\"linkText\":\"Doe mee met onze loterij!\",\"textListNL\":{\"0\":\"Joybuy is trots om de officiële e commerce innovatiepartner te zijn van de UEFA Champions League, een van de meest vertrouwde en gerenommeerde sportcompetities ter wereld.\",\"1\":\"Samen brengen we voetbalfans dichter bij de actie, niet alleen op wedstrijddagen, maar ook in hoe zij de producten en ervaringen ontdekken, kopen en beleven die voor hen het belangrijkst zijn. Deze samenwerking gaat verder dan alleen een logo. Het betekent dat jij als fan een meer verbonden ervaring krijgt, met speciale momenten en ticketloterijen geïnspireerd door het grootste voetbalevenement ter wereld, allemaal op een eenvoudige en vertrouwde manier via Joybuy.\"},\"textList\":{\"0\":\"Joybuy is trots de officiële e-commerce innovatiepartner te zijn van de UEFA Champions League, een van de meest gerenommeerde en betrouwbare sportcompetities ter wereld.\",\"1\":\"Ons gezamenlijke doel is voetbalfans dichter bij hun passie te brengen, niet alleen tijdens wedstrijden maar ook daarbuiten. Dankzij deze samenwerking willen we de manier veranderen waarop supporters producten en ervaringen ontdekken, kopen en ermee omgaan. Beleef je passie ten volle met unieke kansen zoals ticketloterijen en bijzondere momenten.\"}}}}}}}},\"2\":{\"title\":\"Klantenservice die 24/7 voor je klaarstaat \",\"contentList\":{\"0\":{\"contextList\":{\"0\":{\"title\":\"Klantenservice die 24/7 voor je klaarstaat \",\"subTitle\":\"Heb je een vraag? Ons supportteam staat 24/7 voor je klaar om je te helpen, wanneer je ons ook nodig hebt.\"},\"1\":{\"textContentList\":{\"0\":{\"title\":\"Heb je ons nodig? We staan voor je klaar!\",\"subTitle\":\"Snel en betrouwbaar n Milton Keynes. In andere regio's is levering de volgende dag of binnen twee dagen mogelijk.\",\"1\":\"Levertijden kunnen variëren, afhankelijk van het product en de bestemming. Standaardproducten worden snel geleverd, terwijl producten die speciale zorg nodig hebben de levertijden volgen die je tijdens het afrekenen ziet.\",\"2\":\"Drukke feestdagen of onverwacht weer kunnen de levering soms wat vertragen, maar we houden je altijd op de hoogte.\"}}}}}},\"1\":{\"contextList\":{\"0\":{\"title\":\"Hoe werkt het?\",\"subTitle\":\"Kies je bezorgtijd\",\"textContentList\":{\"0\":{\"iconText\":\"Stap 1\",\"title\":\"Ga naar de afrekenpagina\",\"text\":\"Bekijk de beschikbare bezorgtijdslots direct op de afrekenpagina.\"},\"1\":{\"iconText\":\"Stap 2\",\"title\":\"Kies een tijdslot\",\"text\":\"Kies het tijdslot dat jou het beste uitkomt.\"},\"2\":{\"iconText\":\"Stap 3\",\"title\":\"Geniet van je JoyExpress levering\",\"text\":\"Onze vertrouwde bezorgpartner levert je bestelling tot aan je deur.\"}}}}}}},\"1\":{\"title\":\"Je favoriete merken, kwaliteit waar je op kunt vertrouwen\",\"titleFr\":\"Je favoriete merken, kwaliteit waar je op kunt vertrouwen\",\"contentList\":{\"0\":{\"contextList\":{\"0\":{\"title\":\"Je favoriete merken, kwaliteit waar je op kunt vertrouwen\",\"titleFr\":\"Je favoriete merken, kwaliteit waar je op kunt vertrouwen\",\"subTitle\":\"Elk artikel is gecontroleerd op kwaliteit. Shop met vertrouwen bij geverifieerde verkopers en met onze beveiligde checkout.\"},\"1\":{\"textContentList\":{\"0\":{\"title\":\"Producten van hoge kwaliteit\",\"subTitle\":\"Met zorg geselecteerde kwaliteitsproducten voor jou\",\"textListNl\":{\"0\":\"kwaliteitsproducten voor jou Joybuy beheert de volledige retailoperatie van begin tot eind, van het inkopen van producten tot en met de levering. Zo zorgen we ervoor dat alles voldoet aan onze kwaliteitsnormen.\",\"1\":\"Ons doel is om een betrouwbare en veilige winkelervaring te bieden, waarbij elke bestelling zorgvuldig wordt verwerkt via een professioneel en compliant systeem.\"},\"textListEn\":{\"0\":\"Joybuy beheert de volledige logistieke keten van productinkoop tot levering om een kwaliteit te garanderen die aan onze standaarden voldoet. Voor belangrijke categorieën zoals\",\"1\":\"verkoopsysteem dat wordt beheerd door professionals en volledig voldoet aan de geldende regelgeving om een betrouwbare winkelervaring te bieden waarop onze klanten volledig kunnen vertrouwen.\"},\"textList\":{\"0\":\"Joybuy beheert de volledige logistieke keten van productinkoop tot levering om een kwaliteit te garanderen die aan onze standaarden voldoet. Voor belangrijke categorieën zoals\",\"1\":\"verkoopsysteem dat wordt beheerd door professionals en volledig voldoet aan de geldende regelgeving om een betrouwbare winkelervaring te bieden waarop onze klanten volledig kunnen vertrouwen.\",\"2\":\"verkoopsysteem dat wordt beheerd door professionals en volledig voldoet aan de geldende regelgeving om een betrouwbare winkelervaring te bieden waarop onze klanten volledig kunnen vertrouwen.\"}}}}}},\"1\":{\"contextList\":{\"0\":{\"title\":\"Goedgekeurde retailer\",\"subTitle\":\"Uitgelichte merken\",\"textContentList\":{\"0\":{\"iconText\":\"Samsung\"},\"1\":{\"iconText\":\"PlayStation\"},\"2\":{\"iconText\":\"Morrisons\"},\"3\":{\"iconText\":\"De’Longhi\"}}},\"1\":{\"textContentList\":{\"0\":{\"title\":\"Groot nieuws\",\"subTitle\":\"Groot nieuws\",\"subTitleFr\":\"Groot nieuws\",\"subTitleNl\":\"Trotse UEFA sponsor\",\"linkText\":\"Doe mee met onze loterij!\",\"textListNL\":{\"0\":\"Joybuy is trots om de officiële e commerce innovatiepartner te zijn van de UEFA Champions League, een van de meest vertrouwde en gerenommeerde sportcompetities ter wereld.\",\"1\":\"Samen brengen we voetbalfans dichter bij de actie, niet alleen op wedstrijddagen, maar ook in hoe zij de producten en ervaringen ontdekken, kopen en beleven die voor hen het belangrijkst zijn. Deze samenwerking gaat verder dan alleen een logo. Het betekent dat jij als fan een meer verbonden ervaring krijgt, met speciale momenten en ticketloterijen geïnspireerd door het grootste voetbalevenement ter wereld, allemaal op een eenvoudige en vertrouwde manier via Joybuy.\"},\"textList\":{\"0\":\"Joybuy is trots de officiële e-commerce innovatiepartner te zijn van de UEFA Champions League, een van de meest gerenommeerde en betrouwbare sportcompetities ter wereld.\",\"1\":\"Ons gezamenlijke doel is voetbalfans dichter bij hun passie te brengen, niet alleen tijdens wedstrijden maar ook daarbuiten. Dankzij deze samenwerking willen we de manier veranderen waarop supporters producten en ervaringen ontdekken, kopen en ermee omgaan. Beleef je passie ten volle met unieke kansen zoals ticketloterijen en bijzondere momenten.\"}}}}}}}},\"2\":{\"title\":\"Klantenservice die 24/7 voor je klaarstaat \",\"contentList\":{\"0\":{\"contextList\":{\"0\":{\"title\":\"Klantenservice die 24/7 voor je klaarstaat \",\"subTitle\":\"Heb je een vraag? Ons supportteam staat 24/7 voor je klaar om je te helpen, wanneer je ons ook nodig hebt.\"},\"1\":{\"textContentList\":{\"0\":{\"title\":\"Heb je ons nodig? We staan voor je klaar!\",\"subTitle\":\"Snel en betrouwbaar antwoord\",\"textList\":{\"0\":\"Ervaar premium support met onze 24/7 online klantenservice. Of het nu dag of nacht is, we zijn altijd slechts één klik verwijderd en zorgen ervoor dat je op het juiste moment de hulp krijgt die je nodig hebt.\",\"1\":\"We starten de verwerking van je klacht binnen 1 werkdag en reageren binnen 2 werkdagen. We blijven je ondersteunen totdat de klacht volledig is opgelost.\"}}}}}},\"1\":{\"contextList\":{\"0\":{\"title\":\"Jouw 24/7 supportteam\",\"subTitle\":\"Neem contact met ons op\",\"textContentList\":{\"0\":{\"iconText\":\"Chat met ons\",\"iconSubTitle\":\"Altijd en op elk moment.\",\"linkUrl\":\"https://help.joybuy.com/hc/en-gb?_gl=1*15jp2a2*_gcl_aw*R0NMLjE3Njg4NDQyOTQuQ2p3S0NBaUF5YmZMQmhBakVpd0FJMG1CQnFNNkljUENkTHJLNkl0YTlvN3UtaTNnM25sVWh1RC1 \"4\":{\"title\":\"Eenvoudige retourzendingen binnen 30 dagen, zonder gedoe\",\"contentList\":{\"0\":{\"contextList\":{\"0\":{\"title\":\"Eenvoudige retourzendingen binnen 30 dagen, zonder gedoe\",\"subTitle\":\"Van gedachten veranderd? Geen probleem! Je krijgt je volledige geld terug bij retourzendingen binnen 30 dagen. Geen gedoe, geen stress.\",\"linkText\":\"Bekijk retourbeleid\",\"linkUrl\":\"https://help.joybuy.com/hc/en-gb/articles/49070525021209-Our-Return-Policy\",\"linkUrlForDe\":\"https://help.joybuy.com/hc/en-gb/articles/49070525021209-Our-Return-Policy\"},\"1\":{\"title\":\"Hoe werkt het?\",\"subTitle\":\"Retourneren, zo gepiept\",\"textContentList\":{\"0\":{\"iconText\":\"Stap 1\",\"title\":\"Retourneer je artikel binnen 30 dagen\",\"text\":\"Klik op “Retourneer artikel” op de bestelpagina om je keuze te maken.\"},\"1\":{\"iconText\":\"Stap 2\",\"title\":\"Stuur het gratis terug\",\"text\":\"Labels zijn in de meeste gevallen al betaald – wij regelen het voor je!\"},\"2\":{\"iconText\":\"Stap 3\",\"title\":\"Ontvang je terugbetaling\",\"text\":\"Deze wordt binnen 3–5 werkdagen teruggestort op je account zodra we de retour volgens ons beleid hebben bevestigd.\"}}}}}}},\"5\":{\"title\":\"Winkel veilig, betaal met vertrouwen\",\"contentList\":{\"0\":{\"contextList\":{\"0\":{\"title\":\"Winkel veilig, betaal met vertrouwen\",\"subTitle\":\"Jouw veiligheid staat voorop. Met betrouwbare wereldwijde betalingspartners en veilige technologie is elke aankoop beschermd.\"},\"1\":{\"title\":\"Veilig, eenvoudig en flexibel\",\"subTitle\":\"Jouw betaling, jouw manier\",\"textContentList\":{\"0\":{\"iconText\":\"Klarna\",\"iconSubTitle\":\"Betaling in termijnen\"},\"1\":{\"iconText\":\"PayPal\",\"iconSubTitle\":\"Betaal in 3 delen\"},\"2\":{\"iconText\":\"Apple Pay\",\"iconSubTitle\":\"Betaal op de Apple manier\"},\"3\":{\"iconText\":\"Google Pay\",\"iconSubTitle\":\"Eenvoudig afrekenen\"}}}}},\"1\":{\"contextList\":{\"0\":{\"title\":\"Veilig, eenvoudig en flexibel\",\"subTitle\":\"Wij accepteren\",\"textContentList\":{\"0\":{\"iconText\":\"American Express\"},\"1\":{\"iconText\":\"VISA\"},\"2\":{\"iconText\":\"Mastercard\"},\"3\":{\"iconText\":\"Maestro\"}}}}}}},\"6\":{\"title\":\"Nodig vrienden uit en krijg €10 korting\",\"titleNotLogin\":\"Nodig vrienden uit, verdien beloningen!\",\"titleNl\":\"Nodig vrienden uit en ontvang €10 korting\",\"contentList\":{\"0\":{\"contextList\":{\"0\":{\"title\":\"Nodig vrienden uit en krijg €10 korting\",\"titleNl\":\"Nodig vrienden uit en ontvang €10 korting\",\"subTitle\":\"Deel Joybuy met je vrienden en verdien beloningen die je samen kunt gebruiken.\",\"linkText\":\"Nodig nu uit\"},\"1\":{\"title\":\"Hoe werkt het?\",\"subTitle\":\"Nodig een vriend uit en vier de voordelen samen!\",\"textContentList\":{\"0\":{\"iconText\":\"Step1\",\"title\":\"Deel je uitnodigingscode\",\"text\":\"Ga naar je persoonlijke profiel om je exclusieve uitnodigingscode te bekijken. Kopieer de code of deel direct de link om je vrienden uit te nodigen.\"},\"1\":{\"iconText\":\"Step2\",\"title\":\"Je vriend(in) plaatst een bestelling\",\"text\":\"Je vrienden kunnen de code die je gedeeld hebt gebruiken bij hun eerste bestelling tijdens het afrekenen.\"},\"2\":{\"iconText\":\"Step3\",\"title\":\"Verdien je beloning\",\"text\":\"Wanneer je vrienden hun eerste bestelling plaatsen en ontvangen, krijg jij een voucher als beloning.\"}}}}}}},\"7\":{\"title\":\"JoyPlus, meer dan alleen een membership\",\"contentList\":{\"0\":{\"contextList\":{\"0\":{\"textContentList\":{\"0\":{\"title\":\"\",\"subTitle\":\"Meer dan alleen een membership\",\"subTitleNl\":\"Meer dan alleen een membership\",\"textListNl\":{\"0\":\"Geniet van onbeperkte gratis verzending op miljoenen artikelen, snel en betrouwbaar, zonder minimumbedrag.\",\"1\":\"Verdien exclusieve punten; elke aankoop telt en je kunt ze inwisselen voor kortingen op toekomstige bestellingen.\",\"2\":\"Profiteer van extra besparingen en exclusieve prijzen op nieuwe producten, elke dag.\"},\"textList\":{\"0\":\"Geniet van onbeperkte gratis verzending op miljoenen artikelen – snel en betrouwbaar. Geen minimumbedrag vereist.\",\"1\":\"Verdien exclusieve punten. Elke aankoop telt! Wissel ze in voor kortingen op toekomstige bestellingen.\",\"2\":\"Extra besparingen en exclusieve prijzen op nieuwe producten, elke dag.\",\"3\":\"Elke week ontvang je extra speciale kortingen op Plus-dagen.\"},\"linkText\":\"Word nu lid van JoyPlus!\"}}}}}}}},\"footerInfo\":{\"0\":{\"title\":\"Algemene voorwaarden\",\"detailList\":{\"0\":\"Algemene voorwaarden zijn van toepassing. Voor de volledige  voorwaarden, \",\"1\":\" klik hier.\"}},\"1\":{\"title\":\"Waar kan ik mijn welkomstaanbieding vinden?\",\"detailList\":{\"0\":\"Binnen 30 dagen na registratie kun je in de 'Nieuwe Klanten Tijdelijke Voordelen' zone je exclusieve welkomstprijs voor een artikel naar keuze vinden!\",\"1\":\"Hoe te gebruiken? Heel simpel!\",\"2\":\"Ga naar de Nieuwe Klanten Tijdelijke Voordelen zone, blader er lekker op los en voeg je favoriete artikel toe aan je winkelwagentje.\",\"3\":\"Ga vervolgens naar de afrekenpagina. Het systeem past automatisch de beste nieuwe klantprijs voor je toe. De korting wordt direct verrekend bij het afrekenen—geen handmatige actie nodig.\",\"4\":\"Vriendelijke herinnering:\",\"5\":\"Eenmalig gebruik \u0026 beste deal  automatisch toegepast: Dit voordeel kan slechts één keer per nieuwe gebruiker worden gebruikt. Als er meerdere items uit deze zone in je winkelwagen zitten, past het systeem de korting automatisch toe op slechts één item. De andere items worden afgerekend tegen de originele prijs of de huidige algemene promotieprijs.\",\"6\":\"Kortingen combineren:\",\"7\":\"Items die al van de nieuwe klantprijs profiteren, kunnen niet worden gecombineerd met andere coupons of promoties, maar verzendcoupons kunnen nog wel worden gebruikt.\",\"8\":\"App-exclusief aanbod: Dit welkomstaanbod is alleen beschikbaar via de app.\\nBegin nu met winkelen en start je
