<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5C7A5A">
<title>Aanbiedingen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --groen:#5C7A5A; --groen-d:#475f45; --groen-l:#e7eee5; --bg:#FAF7F2; --kaart:#fff;
  --tekst:#24302a; --zacht:#6b756d; --lijn:#e7e1d6; --accent:#c2562f;
  --r:14px; --side:240px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tekst);font-family:Inter,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit}

/* zijbalk */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--kaart);border-right:1px solid var(--lijn);padding:22px 14px;display:flex;flex-direction:column;gap:4px;z-index:30;transition:transform .2s}
.logo{font-weight:800;font-size:19px;color:var(--groen);padding:4px 10px 18px;letter-spacing:-.02em}
.logo small{display:block;font-weight:500;font-size:12px;color:var(--zacht);letter-spacing:0;margin-top:2px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:0;background:none;text-align:left;cursor:pointer;font-weight:500}
.nav:hover{background:var(--groen-l)}
.nav.actief{background:var(--groen);color:#fff}
.nav .tel{margin-left:auto;font-size:12px;opacity:.75}
.side .onder{margin-top:auto;font-size:12px;color:var(--zacht);padding:10px 12px;line-height:1.5}

main{margin-left:var(--side);padding:24px 28px 80px;max-width:1280px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.top h1{font-size:24px;margin:0;letter-spacing:-.02em}
.menu{display:none;border:0;background:var(--kaart);border-radius:10px;width:42px;height:42px;font-size:20px;box-shadow:0 1px 3px #0001}
.zoek{flex:1;min-width:200px;position:relative}
.zoek input{width:100%;padding:11px 14px 11px 38px;border-radius:12px;border:1px solid var(--lijn);background:var(--kaart);outline:none}
.zoek input:focus{border-color:var(--groen)}
.zoek::before{content:"⌕";position:absolute;left:13px;top:8px;font-size:19px;color:var(--zacht)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.chip{border:1px solid var(--lijn);background:var(--kaart);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip .stip{width:9px;height:9px;border-radius:50%}
.chip.uit{opacity:.4;text-decoration:line-through}
.wchip{opacity:.55}
.wchip.gekozen{opacity:1;border-color:var(--wk);box-shadow:inset 0 0 0 1px var(--wk);font-weight:700}
.chip.aan{background:var(--groen);border-color:var(--groen);color:#fff}
select.chip{appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--zacht) 50%),linear-gradient(135deg,var(--zacht) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.info{font-size:13px;color:var(--zacht);margin:6px 0 14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.k{background:var(--kaart);border-radius:var(--r);box-shadow:0 1px 3px #0000000d,0 0 0 1px #0000000a;overflow:hidden;display:flex;flex-direction:column;position:relative}
.k.volg{box-shadow:0 0 0 2px var(--groen)}
.k .foto{aspect-ratio:4/3;background:#f3f0ea center/contain no-repeat;position:relative}
.k .foto img{width:100%;height:100%;object-fit:contain;padding:10px}
.pct{position:absolute;left:10px;top:10px;background:var(--accent);color:#fff;font-weight:800;font-size:18px;padding:5px 10px;border-radius:10px;letter-spacing:-.02em}
.pct small{font-size:11px;font-weight:600;display:block;margin-bottom:-2px;opacity:.9}
.pct.geen{background:#8b938c;font-size:12px;font-weight:600}
.ster{position:absolute;right:8px;top:8px;border:0;background:#fffd;border-radius:50%;width:34px;height:34px;font-size:17px;cursor:pointer;color:var(--groen)}
.k .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.winkel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.winkel .stip{width:8px;height:8px;border-radius:50%}
.titel{font-weight:600;line-height:1.3;font-size:14px}
.actie{display:inline-block;background:var(--groen-l);color:var(--groen-d);font-weight:700;font-size:12.5px;padding:3px 8px;border-radius:6px;align-self:flex-start}
.prijs{margin-top:auto;display:flex;align-items:baseline;gap:8px}
.prijs b{font-size:18px}
.prijs s{color:var(--zacht);font-size:13px}
.geldig{font-size:12px;color:var(--zacht)}

.paneel{background:var(--kaart);border-radius:var(--r);padding:18px 20px;box-shadow:0 1px 3px #0000000d,0 0 0 1px #0000000a;margin-bottom:16px}
.paneel h2{margin:0 0 4px;font-size:17px}
.paneel p{margin:0 0 12px;color:var(--zacht);font-size:13.5px}
.rij{display:flex;gap:8px;flex-wrap:wrap}
.rij input{flex:1;min-width:160px;padding:10px 12px;border-radius:10px;border:1px solid var(--lijn);outline:none}
.knop{border:0;background:var(--groen);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer}
.knop.licht{background:var(--groen-l);color:var(--groen-d)}
.term{display:inline-flex;align-items:center;gap:6px;background:var(--groen-l);color:var(--groen-d);padding:6px 6px 6px 12px;border-radius:999px;font-size:13px;font-weight:600;margin:4px 4px 0 0}
.term button{border:0;background:#fff8;border-radius:50%;width:22px;height:22px;cursor:pointer;color:var(--groen-d)}
.term .n{background:var(--groen);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px}
.nieuw{position:absolute;left:10px;bottom:10px;background:var(--groen);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em}
.nieuw.inline{position:static;display:inline-block;padding:1px 6px}
.badge{background:#fff;color:var(--groen-d);border-radius:999px;padding:1px 7px;font-size:11px}
.nav:not(.actief) .badge{background:var(--groen);color:#fff}
.term.uit{background:#eee;color:#8a8a8a}.term.uit .n{background:#bbb}
.zoekbalk{display:flex;flex-direction:column;gap:8px;padding:12px 14px}.zoekbalk span{font-size:13.5px}
.modus{display:flex;background:var(--kaart);border:1px solid var(--lijn);border-radius:12px;padding:3px;gap:3px;order:-1;flex-basis:100%}
.modus button{flex:1;border:0;background:none;padding:9px 12px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--zacht)}
.modus button.aan{background:var(--groen);color:#fff}
.modus button[data-modus="bf"].aan{background:#1d1d1d}
.modus .tel{font-weight:500;font-size:12px;opacity:.8;margin-left:4px}
.tw{display:block;font-size:12px;line-height:1.45;background:#f4f1ea;border-radius:8px;padding:7px 9px;text-decoration:none;color:var(--tekst)}
.tw span{display:block;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#8a6d1f;margin-bottom:2px}
.goed{color:var(--groen-d)}.slecht{color:var(--accent)}
.ref{font-size:11.5px;color:var(--zacht)}.ref.zwak{color:var(--accent)}
.modus button[data-modus="echt"].aan{background:var(--accent)}
.per{font-size:12px;color:var(--zacht);margin-left:auto}
.laag{font-size:11.5px;font-weight:700;color:var(--groen-d)}
.arij{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--lijn);text-decoration:none;color:inherit}
.arij .anaam{flex:1;font-size:13.5px;line-height:1.3}.arij small{display:block;color:var(--zacht);font-size:11.5px}
.arij .aprijs{text-align:right;font-weight:700;white-space:nowrap}.arij .stip{width:8px;height:8px;border-radius:50%;flex:none}
.ster.op{background:var(--groen);color:#fff}
.aplus{border:1px solid var(--lijn);background:#fff;border-radius:50%;width:32px;height:32px;flex:none;font-size:17px;cursor:pointer;color:var(--groen)}
.aplus.op{background:var(--groen);color:#fff;border-color:var(--groen)}
.arij .anaam{text-decoration:none;color:inherit}
.lregel,.vink{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--lijn)}
.lregel .anaam,.vink .anaam{flex:1;font-size:14px;line-height:1.3}.lregel small,.vink small{display:block;color:var(--zacht);font-size:12px}
.lregel .aprijs,.vink .aprijs{text-align:right;font-weight:700;white-space:nowrap}.lregel .aprijs small{font-weight:400}
.vink input{width:22px;height:22px;accent-color:var(--groen);flex:none}
.vink.af .anaam{text-decoration:line-through;color:var(--zacht)}
.wkop{display:flex;align-items:center;gap:8px;font-size:15px;margin:16px 0 4px}.wkop .stip{width:10px;height:10px;border-radius:50%}
.link{border:0;background:none;color:var(--groen-d);text-decoration:underline;cursor:pointer;padding:0;font-size:12.5px}
#melding{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#24302a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;box-shadow:0 4px 20px #0003}
.elders{font-size:11.5px;line-height:1.35;color:var(--accent);background:#fbeee8;border-radius:7px;padding:5px 8px}.elders small{color:var(--zacht)}
.leeg{text-align:center;color:var(--zacht);padding:40px 10px}
table.status{width:100%;border-collapse:collapse;font-size:14px}
table.status td,table.status th{padding:9px 6px;border-bottom:1px solid var(--lijn);text-align:left;vertical-align:top}
.ok{color:var(--groen);font-weight:700}.fout{color:var(--accent);font-weight:700}
.sub{font-size:12px;color:var(--zacht)}
.dek{display:none}

@media (max-width:820px){
  .side{transform:translateX(-100%);box-shadow:0 0 40px #0003}
  .side.open{transform:none}
  .dek.open{display:block;position:fixed;inset:0;background:#0003;z-index:20}
  main{margin-left:0;padding:14px 12px 80px}
  .menu{display:block}
  .top h1{font-size:20px}
  .zoek{order:3;flex-basis:100%}
  .filters{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:0 -12px 6px;padding-left:12px;padding-right:12px;scrollbar-width:none}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .k .body{padding:10px 11px 12px}
  .titel{font-size:13px}
  .pct{font-size:15px;padding:4px 8px}
}
</style>
</head>
<body>
<div class="dek" id="dek"></div>
<aside class="side" id="side">
  <div class="logo">Aanbiedingen<small>Groesbeek en omstreken</small></div>
  <button class="nav actief" data-view="alle">Alle aanbiedingen <span class="tel" id="tel-alle"></span></button>
  <button class="nav" data-view="lijstjes">Mijn lijstjes <span class="tel" id="tel-lijstjes"></span></button>
  <button class="nav" data-view="nonfood">Non-food <span class="tel" id="tel-nonfood"></span></button>
  <button class="nav" data-view="winkels">Winkels &amp; status</button>
  <div class="onder" id="bijgewerkt">Laden…</div>
</aside>

<main>
  <div class="top">
    <button class="menu" id="menu" aria-label="Menu">☰</button>
    <div class="modus"><button data-modus="boodschappen" class="aan">Boodschappen</button><button data-modus="bf">Black Friday <span class="tel" id="tel-bf"></span></button><button data-modus="echt">Echte deals <span class="tel" id="tel-echt"></span></button></div>
    <h1 id="kop">Alle aanbiedingen</h1>
    <div class="zoek" id="zoekvak"><input id="zoek" type="search" placeholder="Zoek product of merk" autocomplete="off"></div>
  </div>
  <div id="inhoud"></div>
</main>

<script>
const WINKELS = {
  ah:{naam:"Albert Heijn",kleur:"#00A0E2"}, jumbo:{naam:"Jumbo",kleur:"#E8B400"},
  lidl:{naam:"Lidl",kleur:"#0050AA"}, aldi:{naam:"Aldi",kleur:"#1E2D78"},
  plus:{naam:"PLUS",kleur:"#3C9A3A"}, aldi_sued:{naam:"Aldi Süd",kleur:"#00A0DE"},
  kaufland:{naam:"Kaufland",kleur:"#E10915"},
  bol:{naam:"bol.com",kleur:"#0000A4"}, coolblue:{naam:"Coolblue",kleur:"#0090E3"},
  mediamarkt:{naam:"MediaMarkt",kleur:"#DF0000"}, amazon:{naam:"Amazon.nl",kleur:"#FF9900"},
  lidl_online:{naam:"Lidl webshop",kleur:"#0050AA"}, pepper:{naam:"Pepper.com",kleur:"#E4502D"}
};
const OPSLAG = "aanbiedingen-v1";
const standaard = {actief:0, lijstModus:"overzicht", echtMin:30, verborgen:[], gevolgd:[], lijstjes:[], gezien:{}, sorteer:"korting", cat:"", alleenPct:false, geenMeer:false};
let st = laadState();
// Gevolgd en Lijstjes zijn samengevoegd: gevolgde termen worden het eerste lijstje
if (st.gevolgd && st.gevolgd.length){
  if (!st.lijstjes.length) st.lijstjes.push({naam:"Mijn lijst", termen:[]});
  st.gevolgd.forEach(t => { if (!st.lijstjes[0].termen.includes(t)) st.lijstjes[0].termen.push(t); });
  st.gevolgd = [];
}
st.lijstjes.forEach(l => { l.af = l.af || {}; });
if (st.actief >= st.lijstjes.length) st.actief = 0;
let data = [], status = {}, view = "alle", zoekterm = "";

function laadState(){ try{ return {...standaard, ...JSON.parse(localStorage.getItem(OPSLAG)||"{}")}; }catch(e){ return {...standaard}; } }
function bewaar(){ try{ localStorage.setItem(OPSLAG, JSON.stringify(st)); }catch(e){} }
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const euro = n => n==null ? "" : "€" + n.toFixed(2).replace(".", ",");
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const hooiberg = a => a._h || (a._h = norm([a.titel, a.merk, a.actie, a.categorie, a.eenheid, (WINKELS[a.winkel]||{}).naam].join(" ")));
// "koffie lavazza" = beide woorden; "koffie, thee" = een van beide
const matcht = (a, term) => norm(term).split(",").map(d => d.trim()).filter(Boolean)
  .some(deel => deel.split(/\s+/).every(w => hooiberg(a).includes(w)));
const sleutelVan = a => a.winkel + "|" + a.titel + "|" + a.actie;
const isMeerkoop = a => /\+|2\s*(e|de)\b|voor\s*€?\d|für|\d\.?\s*(artikel|stück)/i.test(a.actie);
const opLijst = a => st.lijstjes.some(l => l.termen.some(t => matcht(a, t)));
const gevolgd = opLijst;
function actieveLijst(){
  if (!st.lijstjes.length) st.lijstjes.push({naam:"Mijn lijst", termen:[], af:{}});
  return st.lijstjes[Math.min(st.actief, st.lijstjes.length-1)];
}
// van een producttitel een zoekterm maken: zonder maten en losse getallen
const termVan = titel => titel.toLowerCase().replace(/\(.*?\)/g," ").replace(/\b\d+([.,]\d+)?\s*(x|g|gr|gram|kg|ml|cl|l|liter|stuks?|st)\b/g," ")
  .replace(/[^a-z0-9à-ÿ&' -]/g," ").replace(/\s+/g," ").trim().split(" ").slice(0,5).join(" ");
let melding = "";
function meld(t){ melding = t; teken(); setTimeout(()=>{ melding=""; const m=document.getElementById("melding"); if(m) m.remove(); }, 2200); }

async function start(){
  try{
    const [d, s] = await Promise.all([
      fetch("data/aanbiedingen.json?"+Date.now()).then(r=>r.json()),
      fetch("data/status.json?"+Date.now()).then(r=>r.json()).catch(()=>({}))
    ]);
    data = d.aanbiedingen || []; status = s;
    const t = d.bijgewerkt ? new Date(d.bijgewerkt) : null;
    document.getElementById("bijgewerkt").textContent = t ? "Bijgewerkt " + t.toLocaleString("nl-NL",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "";
  }catch(e){
    document.getElementById("bijgewerkt").textContent = "Nog geen gegevens";
  }
  teken();
}

function zichtbaar(){
  return data.filter(a => !st.verborgen.includes(a.winkel) && !a.nonfood);
}
const WEBSHOPS = ["bol","coolblue","mediamarkt","amazon","pepper"];
// bij welk tabblad hoort een aanbieding; winkelknoppen blijven zichtbaar, ook als je ze uitzet
const soort = a => (a.bf || WEBSHOPS.includes(a.winkel)) ? "bf" : a.nonfood ? "nonfood" : "boodschappen";
const pastBij = (a, s) => s==="echt" ? !!a.echt && (a.korting||0) >= st.echtMin : soort(a)===s;
const huidigeSoort = () => view==="blackfriday" ? "bf" : view==="nonfood" ? "nonfood" : view==="echt" ? "echt" : "boodschappen";
function nonfood(){
  return data.filter(a => !st.verborgen.includes(a.winkel) && a.nonfood && !a.bf && !WEBSHOPS.includes(a.winkel));
}
function echteDeals(){
  return data.filter(a => !st.verborgen.includes(a.winkel) && a.echt && (a.korting||0) >= st.echtMin);
}
function blackfriday(){
  return data.filter(a => !st.verborgen.includes(a.winkel) && (a.bf || WEBSHOPS.includes(a.winkel)));
}

// ---- volledig assortiment (normale prijzen), alleen geladen als je zoekt
const ASS_WINKELS = ["ah","jumbo","lidl","plus","aldi"];
let assortiment = null, assLaden = null;
function laadAssortiment(){
  if (assLaden) return assLaden;
  assLaden = Promise.all(ASS_WINKELS.map(w => fetch(`data/assortiment/${w}.json`).then(r=>r.ok?r.json():[]).catch(()=>[])
    .then(rijen => rijen.map(r => ({winkel:w, titel:r[0], prijs:r[1], maat:r[2], per:r[3], per_eenheid:r[4], url:r[5], _h:norm(r[0]+" "+r[2])})))))
    .then(lijsten => { assortiment = lijsten.flat(); teken(); });
  return assLaden;
}
function assortimentBlok(){
  if (!zoekterm || zoekterm.length < 2) return "";
  if (!assortiment){ laadAssortiment(); return `<div class="paneel"><h2>Ook in het assortiment</h2><p>Normale prijzen laden…</p></div>`; }
  const delen = norm(zoekterm).split(",").map(d=>d.trim()).filter(Boolean);
  const hits = assortiment.filter(a => !st.verborgen.includes(a.winkel) && delen.some(d => d.split(/\s+/).every(w => a._h.includes(w))));
  hits.sort((a,b) => (a.per??9999)-(b.per??9999) || a.prijs-b.prijs);
  const rij = a => { const w = WINKELS[a.winkel]; const op = st.lijstjes.some(l => l.termen.includes(termVan(a.titel)));
    return `<div class="arij"><span class="stip" style="background:${w.kleur}"></span>
    <a class="anaam" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.titel)}<small>${esc(w.naam)}${a.maat?" · "+esc(a.maat):""}</small></a>
    <span class="aprijs">${euro(a.prijs)}${a.per?`<small>${euro(a.per)}/${a.per_eenheid}</small>`:""}</span>
    <button class="aplus${op?" op":""}" data-plus="${esc(a.titel)}">${op?"✓":"+"}</button></div>`; };
  return `<div class="paneel"><h2>Ook in het assortiment <span class="sub">normale prijzen, goedkoopste per kg/l eerst</span></h2>
    ${hits.length ? hits.slice(0,80).map(rij).join("") + (hits.length>80?`<p class="sub">${hits.length} producten, eerste 80 getoond. Maak je zoekterm specifieker.</p>`:"") : '<p class="sub">Niets gevonden.</p>'}
    <p class="sub" style="margin-top:8px">Bron: open data van Checkjebon (AH, Jumbo, Lidl, PLUS), een paar keer per week bijgewerkt. Aldi: wekelijks van aldi.nl gehaald.</p></div>`;
}

function assortimentHits(term){
  if (!assortiment) return [];
  const delen = norm(term).split(",").map(d=>d.trim()).filter(Boolean);
  return assortiment.filter(a => !st.verborgen.includes(a.winkel) && delen.some(d => d.split(/\s+/).every(w => a._h.includes(w))));
}
// voordeligste optie voor een regel op je lijst: eerst een aanbieding, anders het goedkoopste product per kg/l
function besteOptie(term){
  const acties = alleWinkels().filter(a => !a.nonfood && matcht(a, term));
  if (acties.length){
    const a = acties.sort((x,y) => (x.per??9999)-(y.per??9999) || (y.korting??-1)-(x.korting??-1))[0];
    return {winkel:a.winkel, prijs:a.prijs_nu, per:a.per, per_eenheid:a.per_eenheid, aanbieding:true,
            uitleg:`${(WINKELS[a.winkel]||{}).naam}: ${a.actie || "aanbieding"}${a.korting!=null && !(a.actie||"").includes("%")?` (-${a.korting}%)`:""} · ${a.titel}`};
  }
  const ass = assortimentHits(term).sort((x,y) => (x.per??9999)-(y.per??9999) || x.prijs-y.prijs);
  if (ass.length){
    const a = ass[0];
    return {winkel:a.winkel, prijs:a.prijs, per:a.per, per_eenheid:a.per_eenheid, aanbieding:false,
            uitleg:`goedkoopst bij ${(WINKELS[a.winkel]||{}).naam}: ${a.titel}${a.maat?` (${a.maat})`:""}`};
  }
  return null;
}
function vulSuggesties(tekst){
  const dl = document.getElementById("suggesties"); if (!dl) return;
  const q = norm(tekst).trim(); if (q.length < 2){ dl.innerHTML = ""; return; }
  const gezien = new Set(), uit = [];
  const bronnen = [...data.map(a => a.titel), ...(assortiment||[]).map(a => a.titel)];
  for (const t of bronnen){
    const k = termVan(t); if (!k || gezien.has(k) || !norm(k).includes(q)) continue;
    gezien.add(k); uit.push(k); if (uit.length >= 12) break;
  }
  // ook het losse woord zelf als bredere term
  const woord = bronnen.map(t => norm(t).split(/\s+/).find(w => w.startsWith(q) && w.length > q.length)).find(Boolean);
  if (woord && !gezien.has(woord)) uit.unshift(woord);
  dl.innerHTML = uit.map(k => `<option value="${esc(k)}">`).join("");
}

function alleWinkels(){ return data.filter(a => !st.verborgen.includes(a.winkel)); }
function lijstHits(l){
  return alleWinkels().filter(a => l.termen.some(t => matcht(a,t)))
    .sort((a,b) => (b.korting??-1)-(a.korting??-1));
}
function nieuwIn(l){
  const gezien = new Set(st.gezien[l.naam] || []);
  return lijstHits(l).filter(a => !gezien.has(sleutelVan(a)));
}
function markeerGezien(){
  st.lijstjes.forEach(l => { st.gezien[l.naam] = lijstHits(l).map(sleutelVan); });
  bewaar();
}

function gefilterd(lijst){
  let l = lijst;
  if (zoekterm) l = l.filter(a => matcht(a, zoekterm));
  if (st.cat) l = l.filter(a => a.categorie === st.cat);
  if (st.alleenPct) l = l.filter(a => a.korting != null);
  if (st.geenMeer) l = l.filter(a => !isMeerkoop(a));
  const s = st.sorteer;
  return [...l].sort((a,b) => {
    if (s==="korting") return (b.korting??-1)-(a.korting??-1) || (gevolgd(b)-gevolgd(a));
    if (s==="prijs") return (a.prijs_nu??999)-(b.prijs_nu??999);
    if (s==="per") return (a.per??9999)-(b.per??9999);
    if (s==="winkel") return a.winkel.localeCompare(b.winkel) || (b.korting??-1)-(a.korting??-1);
    return a.titel.localeCompare(b.titel);
  });
}

function refBlok(a){
  if (!(a.nonfood || a.bf) || !a.prijs_was) return "";
  const ref = {van:"van-prijs = laagste prijs 30 dagen", mediaan:"t.o.v. mediaanprijs Amazon", pepper:"gedeeld en beoordeeld op Pepper", advies:"t.o.v. adviesprijs (zegt weinig)"}[a.ref] || "";
  const hist = a.dagen_gemeten > 1 ? `, ${a.dagen_gemeten} dagen gevolgd${a.laagste_gezien ? `, laagste gezien ${euro(a.laagste_gezien)}` : ""}` : "";
  return ref ? `<div class="ref${a.ref==="advies"?" zwak":""}">${ref}${hist}</div>` : "";
}

function twBlok(a){
  if (!a.tw_url) return "";
  const regels = [];
  if (a.tw_laagste && a.prijs_nu){
    const v = Math.round(100*(1 - a.prijs_nu / a.tw_laagste));
    regels.push(v>0 ? `<b class="goed">${v}% onder</b> laagste prijs elders (${euro(a.tw_laagste)})`
             : v<0 ? `<b class="slecht">${-v}% duurder</b> dan elders (${euro(a.tw_laagste)})` : `gelijk aan laagste prijs elders`);
  }
  if (a.tw_laagste90 && a.prijs_nu){
    const v = Math.round(100*(1 - a.prijs_nu / a.tw_laagste90));
    regels.push(v>=0 ? `<b class="goed">laagste in 90 dagen</b>${v>0?` (${v}% onder)`:""}`
             : `was in 90 dagen al ${euro(a.tw_laagste90)} (<b class="slecht">${-v}% goedkoper</b>)`);
  }
  return `<a class="tw" href="${esc(a.tw_url)}" target="_blank" rel="noopener"><span>Tweakers</span>${regels.join("<br>") || "prijsgeschiedenis bekijken"}</a>`;
}

function kaart(a, nieuw){
  const w = WINKELS[a.winkel] || {naam:a.winkel,kleur:"#888"};
  const v = gevolgd(a);
  const pct = a.korting!=null
    ? `<div class="pct">${a.tot?"<small>tot</small>":""}-${a.korting}%</div>`
    : `<div class="pct geen">actie</div>`;
  const img = a.img ? `<img loading="lazy" src="${esc(a.img)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : "";
  const per = a.per ? `<span class="per">${euro(a.per)}/${a.per_eenheid}</span>` : "";
  const prijs = a.prijs_nu!=null ? `<div class="prijs"><b>${euro(a.prijs_nu)}</b>${a.prijs_was?`<s>${euro(a.prijs_was)}</s>`:""}${per}</div>` : `<div class="prijs"></div>`;
  return `<article class="k${v?" volg":""}">
    <div class="foto">${img}${pct}${nieuw?'<span class="nieuw">Nieuw</span>':""}<button class="ster${v?" op":""}" data-plus="${esc(a.titel)}" title="${v?"Staat op je lijst":"Op lijst zetten"}">${v?"✓":"+"}</button></div>
    <div class="body">
      <div class="winkel" style="color:${w.kleur}"><span class="stip" style="background:${w.kleur}"></span>${esc(w.naam)}</div>
      ${a.url?`<a class="titel" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.titel)}</a>`:`<div class="titel">${esc(a.titel)}</div>`}
      ${a.actie?`<span class="actie">${esc(a.actie)}</span>`:""}
      ${prijs}
      ${a.historisch_laag?`<div class="laag">Laagste prijs sinds we meten</div>`:""}
      ${a.elders?`<div class="elders">Normaal al goedkoper bij ${esc((WINKELS[a.elders.winkel]||{}).naam||a.elders.winkel)}: ${euro(a.elders.per)}/${a.elders.per_eenheid} <small>(${esc(a.elders.titel)})</small></div>`:""}
      ${a.geldig?`<div class="geldig">${esc(a.geldig)}</div>`:""}
      ${twBlok(a)}
      ${refBlok(a)}
    </div></article>`;
}

function filterbalk(bron){
  const cats = [...new Set((bron||data).map(a=>a.categorie))].sort();
  if (st.cat && !cats.includes(st.cat)) st.cat = "";
  const zichtbare = Object.entries(WINKELS).filter(([c]) => data.some(a => a.winkel===c && pastBij(a, huidigeSoort())));
  const allesAan = zichtbare.every(([c]) => !st.verborgen.includes(c));
  const winkelChips = `<button class="chip${allesAan?" aan":""}" data-alle-winkels="1">${allesAan?"✓ ":""}Alle</button>` + zichtbare.map(([c,w]) => {
    const aan = !st.verborgen.includes(c);
    return `<button class="chip wchip${aan?" gekozen":""}" data-winkel="${c}" style="--wk:${w.kleur}">${aan?"✓":""}<span class="stip" style="background:${w.kleur}"></span>${w.naam}</button>`;
  }).join("");
  return `<div class="filters">
    <select class="chip" id="sorteer">
      ${[["korting","Hoogste korting"],["prijs","Laagste prijs"],["per","Laagste prijs per kg/l"],["winkel","Per winkel"],["titel","A tot Z"]].map(([v,t])=>`<option value="${v}"${st.sorteer===v?" selected":""}>${t}</option>`).join("")}
    </select>
    <select class="chip" id="cat"><option value="">Alle categorieën</option>${cats.map(c=>`<option${st.cat===c?" selected":""}>${esc(c)}</option>`).join("")}</select>
    <button class="chip${st.alleenPct?" aan":""}" id="alleenPct">Alleen met %</button>
    <button class="chip${st.geenMeer?" aan":""}" id="geenMeer">Geen meerkoop</button>
  </div>
  <div class="filters">${winkelChips}</div>`;
}

function grid(lijst){
  if (!lijst.length) return `<div class="leeg">Niets gevonden.</div>`;
  const max = 400;
  return `<div class="info">${lijst.length} aanbiedingen${lijst.length>max?`, eerste ${max} getoond`:""}</div><div class="grid">${lijst.slice(0,max).map(kaart).join("")}</div>`;
}

function termBlok(lijst, termen, verwijderAttr){
  return termen.map((t,i) => {
    const n = lijst.filter(a=>matcht(a,t)).length;
    return `<span class="term">${esc(t)} <span class="n">${n}</span><button ${verwijderAttr}="${i}" aria-label="Verwijder">×</button></span>`;
  }).join("") || `<span class="sub">Nog niets toegevoegd.</span>`;
}

      <div class="rij"><select class="chip" id="zoekNaarLijst">${st.lijstjes.map((l,i)=>`<option value="${i}"${i===st.actief?" selected":""}>${esc(l.naam)}</option>`).join("")}<option value="nieuw">+ nieuw lijstje…</option></select>

  }

      <div class="rij" style="margin:6px 0 10px">${[30,40,50,60].map(n=>`<button class="chip${st.echtMin===n?" aan":""}" data-echtmin="${n}">${n}% of meer</button>`).join("")}</div><p>Non-food en Black Friday, gemeten tegen een betrouwbare "van"-prijs: de wettelijke van-prijs (de laagste prijs van de afgelopen 30 dagen, zoals Lidl en Kaufland die tonen), de mediaanprijs van Amazon, of een deal die op Pepper.com door de community is gecontroleerd (zo komen ook bol.com en MediaMarkt erin). Kortingen op een adviesprijs, "tot"-kortingen en meerkoopacties vallen af. Zagen wij het product de afgelopen 30 dagen zelf al veel goedkoper, dan valt het ook af.</p></div>` +
      filterbalk(lijst) + (lijst.length ? grid(gefilterd(lijst)) : `<div class="leeg">Geen echte deals van ${st.echtMin}% of meer bij de gekozen winkels.</div>`);
  }
  else if (view==="blackfriday"){

    el.innerHTML = `<div class="info">Deals van bol.com, Coolblue, MediaMarkt en Amazon.nl. Let op: bij Black Friday is de "van"-prijs vaak opgerekt, dus vergelijk zelf even.</div>` +
      filterbalk(lijst) + (lijst.length ? grid(gefilterd(lijst)) : `<div class="leeg">Geen deals bij de gekozen winkels.</div>`);
  }
  else if (view==="lijstjes"){

      return `<button class="chip${i===li?" aan":""}" data-kies-lijst="${i}">${esc(x.naam)}${n?` <b class="badge">${n}</b>`:""}</button>`;
    }).join("") + `<button class="chip" id="nieuweLijstKnop">+ nieuw lijstje</button>`;
    const modus = `<div class="rij" style="margin:4px 0 0">${[["overzicht","Overzicht"],["winkelen","Winkelen"]].map(([m,t])=>`<button class="chip${st.lijstModus===m?" aan":""}" data-lijstmodus="${m}">${t}</button>`).join("")}</div>`;
    const invoer = `<div class="rij" style="margin-top:10px"><input id="lijstInvoer" list="suggesties" autocomplete="off" placeholder="Product of merk toevoegen, bijv. koffiebonen"><button class="knop" id="lijstToevoegen">+</button></div><datalist id="suggesties"></datalist>`;
    const regels = l.termen.map((t,ti) => ({t, ti, b: besteOptie(t)}));
    let inhoud = "";
    if (!l.termen.length){
      inhoud = `<p class="sub" style="margin-top:12px">Nog leeg. Typ hierboven, of tik op het plusje bij een aanbieding of bij een product in het assortiment.</p>`;
    } else if (st.lijstModus === "winkelen"){

      regels.forEach(r => { const w = r.b ? r.b.winkel : "_"; (groepen[w] = groepen[w] || []).push(r); });

          groepen[w].map(r => `<label class="vink${l.af[r.t]?" af":""}"><input type="checkbox" data-af="${r.ti}"${l.af[r.t]?" checked":""}>

      }).join("") + `<div class="rij" style="margin-top:12px"><button class="knop licht" id="afWissen">Afvinken wissen</button></div>`;
    } else {
      inhoud = `<div class="lregels">` + regels.map(r => `<div class="lregel">
          <span class="anaam">${esc(r.t)}<small>${r.b ? (r.b.aanbieding?`<b class="goed">${esc(r.b.uitleg)}</b>`:esc(r.b.uitleg)) : (assortiment?"niet gevonden":"prijzen laden…")}</small></span>
          <span class="aprijs">${r.b && r.b.prijs!=null ? euro(r.b.prijs) : ""}${r.b && r.b.per ? `<small>${euro(r.b.per)}/${r.b.per_eenheid}</small>` : ""}</span>
          <button class="aplus" data-del-lt="${li}:${r.ti}" aria-label="Verwijder">×</button></div>`).join("") + `</div>`;
      const hits = lijstHits(l);
      const nieuw = new Set(nieuwIn(l).map(sleutelVan));
      const gesorteerd = [...hits].sort((a,b) => nieuw.has(sleutelVan(b)) - nieuw.has(sleutelVan(a)));
      if (gesorteerd.length) inhoud += `<h3 class="wkop" style="margin-top:18px">Nu in de aanbieding${nieuw.size?` <span class="sub">${nieuw.size} nieuw</span>`:""}</h3><div class="grid">${gesorteerd.slice(0,150).map(a=>kaart(a, nieuw.has(sleutelVan(a)))).join("")}</div>`;
    }
    el.innerHTML = `<div class="paneel"><div class="rij">${tabs}</div>${modus}${invoer}
      <div class="rij sub" style="margin-top:8px;justify-content:space-between"><span>Komma = "of": <i>koffiebonen, espresso</i></span>

    markeerGezien();
  }
  else if (view==="winkels"){
    const rijen = Object.entries(WINKELS).map(([c,w]) => {
      const s = status[c] || {};
      const t = s.bijgewerkt ? new Date(s.bijgewerkt).toLocaleString("nl-NL",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "nooit";
      return `<tr><td><span class="chip${st.verborgen.includes(c)?" uit":""}" data-winkel="${c}" style="cursor:pointer"><span class="stip" style="background:${w.kleur}"></span>${w.naam}</span></td>
        <td>${s.ok===undefined?'<span class="sub">nog niet gedraaid</span>':s.ok?'<span class="ok">werkt</span>':'<span class="fout">fout</span>'}<div class="sub">${esc(s.fout||"")}</div></td>
        <td>${s.aantal??0}<div class="sub">${s.met_korting??0} met %</div></td><td class="sub">${t}</td></tr>`;
    }).join("");
    el.innerHTML = `<div class="paneel"><h2>Winkels</h2><p>Tik op een winkel om hem te verbergen of weer te tonen. Gegevens worden elke ochtend opgehaald.</p>
      <table class="status"><tr><th>Winkel</th><th>Status</th><th>Aantal</th><th>Laatst</th></tr>${rijen}</table></div>`;
  }
}

/* events */
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-winkel]");
  if (!t) return;
  if (t.dataset.modus){ view = {bf:"blackfriday", echt:"echt"}[t.dataset.modus] || "alle"; teken(); window.scrollTo(0,0); return; }
  if (t.dataset.view){ view = t.dataset.view; sluitMenu(); teken(); window.scrollTo(0,0); return; }
  if (t.dataset.echtmin){ st.echtMin = +t.dataset.echtmin; bewaar(); teken(); return; }
  if (t.dataset.alleWinkels){ st.verborgen = []; bewaar(); teken(); return; }
  if (t.dataset.winkel){ const c=t.dataset.winkel; st.verborgen = st.verborgen.includes(c)? st.verborgen.filter(x=>x!==c) : [...st.verborgen,c]; bewaar(); teken(); return; }
  if (t.dataset.plus!==undefined){
    const titel = t.dataset.plus, term = termVan(titel);
    // staat er al een term op een lijst die dit product dekt? dan haal je hem eraf
    for (const l of st.lijstjes){
      const i = l.termen.findIndex(x => x===term || matcht({titel, merk:"", actie:"", categorie:"", eenheid:"", winkel:""}, x));
      if (i >= 0){ l.termen.splice(i,1); bewaar(); meld(`Van ${l.naam} gehaald`); return; }
    }
    const l = actieveLijst(); l.termen.push(term); bewaar(); meld(`Op ${l.naam} gezet`); return;
  }
  if (t.dataset.kiesLijst!==undefined){ st.actief = +t.dataset.kiesLijst; bewaar(); teken(); return; }
  if (t.dataset.lijstmodus){ st.lijstModus = t.dataset.lijstmodus; bewaar(); teken(); return; }
  if (t.id==="nieuweLijstKnop"){ const naam = prompt("Naam van het nieuwe lijstje?", "Weekboodschappen"); if(!naam) return; st.lijstjes.push({naam:naam.trim(), termen:[], af:{}}); st.actief = st.lijstjes.length-1; bewaar(); teken(); return; }
  if (t.id==="lijstHernoem"){ const l = actieveLijst(); const naam = prompt("Nieuwe naam", l.naam); if(!naam) return; st.gezien[naam.trim()] = st.gezien[l.naam]; l.naam = naam.trim(); bewaar(); teken(); return; }
  if (t.id==="lijstToevoegen"){ const inp = document.getElementById("lijstInvoer"); const v = inp.value.trim(); if(!v) return; const l = actieveLijst(); if(!l.termen.includes(v)) l.termen.push(v); bewaar(); teken(); document.getElementById("lijstInvoer")?.focus(); return; }
  if (t.id==="afWissen"){ actieveLijst().af = {}; bewaar(); teken(); return; }
  if (t.id==="zoekOpslaan"){
    const keuze = document.getElementById("zoekNaarLijst").value;
    let i = +keuze;
    if (keuze==="nieuw"){ const naam = prompt("Naam van het nieuwe lijstje?"); if(!naam) return; st.lijstjes.push({naam:naam.trim(),termen:[]}); i = st.lijstjes.length-1; }
    if (!st.lijstjes[i].termen.includes(zoekterm)) st.lijstjes[i].termen.push(zoekterm);
    bewaar(); t.textContent = "Bewaard ✓"; setTimeout(teken, 900); return;
  }
  if (t.id==="alleenPct"){ st.alleenPct=!st.alleenPct; bewaar(); teken(); return; }
  if (t.id==="geenMeer"){ st.geenMeer=!st.geenMeer; bewaar(); teken(); return; }
  if (t.id==="voegLijst"){ const v=document.getElementById("nieuweLijst").value.trim(); if(v){st.lijstjes.push({naam:v,termen:[]}); bewaar(); teken();} return; }
  if (t.dataset.delLijst!==undefined){ if(confirm("Lijstje verwijderen?")){ st.lijstjes.splice(+t.dataset.delLijst,1); st.actief = 0; bewaar(); teken(); } return; }
  if (t.dataset.lijstAdd!==undefined){ const i=+t.dataset.lijstAdd; const inp=document.querySelector(`[data-lijst-input="${i}"]`); const v=inp.value.trim(); if(v){ st.lijstjes[i].termen.push(v); bewaar(); teken(); document.querySelector(`[data-lijst-input="${i}"]`)?.focus(); } return; }
  if (t.dataset.delLt!==undefined){ const [li,ti]=t.dataset.delLt.split(":").map(Number); const weg = st.lijstjes[li].termen.splice(ti,1)[0]; delete st.lijstjes[li].af[weg]; bewaar(); teken(); return; }
});
document.addEventListener("change", e => {
  if (e.target.dataset.af!==undefined){ const l = actieveLijst(); const term = l.termen[+e.target.dataset.af]; if (e.target.checked) l.af[term] = true; else delete l.af[term]; bewaar(); teken(); return; }
  if (e.target.id==="sorteer"){ st.sorteer=e.target.value; bewaar(); teken(); }
  if (e.target.id==="cat"){ st.cat=e.target.value; bewaar(); teken(); }
});
document.addEventListener("keydown", e => {
  if (e.key!=="Enter") return;
  if (e.target.id==="lijstInvoer") document.getElementById("lijstToevoegen").click();
  if (e.target.id==="nieuweLijst") document.getElementById("voegLijst").click();
  if (e.target.dataset.lijstInput!==undefined) document.querySelector(`[data-lijst-add="${e.target.dataset.lijstInput}"]`).click();
});
document.addEventListener("input", e => { if (e.target.id==="lijstInvoer") vulSuggesties(e.target.value); });
let zt; document.getElementById("zoek").addEventListener("input", e => { clearTimeout(zt); zt=setTimeout(()=>{ zoekterm=e.target.value.trim(); teken(); },150); });
const side=document.getElementById("side"), dek=document.getElementById("dek");
function sluitMenu(){ side.classList.remove("open"); dek.classList.remove("open"); }
document.getElementById("menu").onclick = () => { side.classList.add("open"); dek.classList.add("open"); };
dek.onclick = sluitMenu;
start();
</script>
</body>
