name: Categorieën bijwerken

# Alleen de indeling opnieuw doen op de bestaande data, zonder te scrapen.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scraper/llm_categorie.py", ".github/workflows/categorie.yml"]

permissions:
  contents: write
  models: read

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  categorie:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Test GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -i -L -X POST https://models.github.ai/inference/chat/completions \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Zeg alleen: hallo"}]}' | head -c 1500
          echo
          curl -sS https://models.github.ai/catalog/models -H "Authorization: Bearer $GITHUB_TOKEN" | head -c 600
      - name: Indelen
        working-directory: scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          from llm_categorie import deel_in
          pad = "../data/aanbiedingen.json"
          d = json.load(open(pad, encoding="utf-8"))
          deel_in(d["aanbiedingen"])
          json.dump(d, open(pad, "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
          PY
      - name: Opslaan
        run: |
          git config user.name "aanbiedingen-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Categorieën bijgewerkt"
          git pull --rebase -X theirs origin main || true
          git push
