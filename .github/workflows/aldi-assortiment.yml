name: Aldi-assortiment (eenmalig)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scraper/aldi_assortiment.py", ".github/workflows/aldi-assortiment.yml"]

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  aldi:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Ophalen
        working-directory: scraper
        run: python aldi_assortiment.py
      - name: Opslaan
        run: |
          git config user.name "aanbiedingen-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data debug
          git diff --cached --quiet && exit 0
          git commit -m "Aldi-assortiment opgehaald"
          git pull --rebase -X theirs origin main || true
          git push
